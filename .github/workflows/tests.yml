name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  overlo4dcore:
    name: Overlo4dCore (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    defaults:
      run:
        working-directory: Packages/Overlo4dCore
    steps:
      - uses: actions/checkout@v4
      - run: swift test
