<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Same seal style as Outdoor Office: off-white disc on near-black, black ink glyph. -->
  <defs>
    <clipPath id="disc">
      <circle cx="512" cy="512" r="392"/>
    </clipPath>
    <!-- Slightly rough, brushed edges. -->
    <filter id="ink" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="13" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <!-- Fist parts; black gaps between them are carved by the mask strokes. -->
    <mask id="fist" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <g transform="translate(512 520) scale(0.82) translate(-512 -560) rotate(-6 512 640)"
         stroke="#000" stroke-width="24" stroke-linejoin="round">
        <rect x="404" y="740" width="216" height="520" rx="48" fill="#fff"/>
        <rect x="300" y="460" width="424" height="340" rx="100" fill="#fff"/>
        <rect x="300" y="396" width="110" height="214" rx="55" fill="#fff"/>
        <rect x="406" y="360" width="110" height="250" rx="55" fill="#fff"/>
        <rect x="512" y="372" width="110" height="238" rx="55" fill="#fff"/>
        <rect x="618" y="410" width="106" height="200" rx="53" fill="#fff"/>
        <rect x="246" y="566" width="376" height="120" rx="60" fill="#fff" transform="rotate(-7 434 626)"/>
      </g>
    </mask>
  </defs>

  <rect width="1024" height="1024" fill="#0F120F"/>
  <circle cx="512" cy="512" r="392" fill="#F3F3EE"/>
  <g clip-path="url(#disc)">
    <g filter="url(#ink)">
      <rect width="1024" height="1024" fill="#111311" mask="url(#fist)"/>
    </g>
  </g>
</svg>
