<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Same seal style as Outdoor Office: off-white disc on near-black, black ink glyph (a tally mark). -->
  <defs>
    <!-- Slightly rough, brushed edges. -->
    <filter id="ink" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="2" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="#0F120F"/>
  <circle cx="512" cy="512" r="392" fill="#F3F3EE"/>
  <g filter="url(#ink)" fill="none" stroke="#111311" stroke-linecap="round">
    <path d="M378,338 Q372,512 380,688" stroke-width="50"/>
    <path d="M462,326 Q468,510 458,694" stroke-width="48"/>
    <path d="M546,334 Q540,512 550,690" stroke-width="50"/>
    <path d="M630,340 Q636,508 626,682" stroke-width="47"/>
    <path d="M296,622 Q500,500 726,392" stroke-width="54"/>
  </g>
</svg>
