version: 1
# Bundle and App Group IDs keep the app's earlier name so installed data carries over.
# The app is shown as "Overlo4d"; targets, modules and the tally:// URL scheme keep the Tally name.
bundleID: com.mahmud.plusultra
product: Tally
infoPath: Support/Tally-Info.plist
entitlementsPath: Support/Tally.entitlements
iconPath: Resources/AppIcon.png
resources:
  - Resources/AppIcon60x60@2x.png
  - Resources/AppIcon60x60@3x.png
  - Resources/Seal.png
  - Resources/Glyph.png
  # Free Exercise DB photos (public domain) shown as exercise demos without any API.
  - Resources/ExercisePhotos
  - Resources/Fonts/BigShouldersDisplayThin-ExtraBold.ttf
  - Resources/Fonts/BigShouldersDisplayThin-Black.ttf
  - Resources/Fonts/SchibstedGrotesk-Regular.ttf
  - Resources/Fonts/SchibstedGrotesk-Medium.ttf
  - Resources/Fonts/SchibstedGrotesk-SemiBold.ttf
  - Resources/Fonts/SchibstedGrotesk-Bold.ttf
extensions:
  - product: TallyWidget
    infoPath: Support/TallyWidget-Info.plist
    entitlementsPath: Support/TallyWidget.entitlements
    resources:
      - Resources/Seal.png
      - Resources/Fonts/BigShouldersDisplayThin-ExtraBold.ttf
      - Resources/Fonts/BigShouldersDisplayThin-Black.ttf
      - Resources/Fonts/SchibstedGrotesk-Medium.ttf
      - Resources/Fonts/SchibstedGrotesk-SemiBold.ttf
      - Resources/Fonts/SchibstedGrotesk-Bold.ttf
